[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "ticktick-py-v2"
version = "0.26.0"
description = "API wrapper for the unofficial TickTick v2 API with full read/write access to Tasks, Habits, Focus Times, and Events"
authors = ["Oliver Stoll <oliverstoll.berlin@gmail.com>"]
readme = "README.md"
packages = [
    { include = "ticktick_v2"}
]


[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.11.5"
python-dotenv = "^1.1.0"
pyyaml = "^6.0.2"
selenium = "^4.32.0"
undetected-chromedriver = "^3.5.5"
webdriver-manager = "^4.0.2"
pytz = "^2025.2"



[tool.poetry.group.dev.dependencies]
poetry = "^2"
pre-commit = "^3.6.0"
ruff = "^0.1.13"
pytest = "^9.0.3"
mypy = "^1.8.0"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
